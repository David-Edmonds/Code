[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "live-draft-assistant"
version = "0.1.0"
description = "A local-first Yahoo Fantasy Football live draft assistant"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.136,<1",
  "httpx>=0.28,<1",
  "jinja2>=3.1,<4",
  "openai>=2.54,<3",
  "pydantic>=2.13,<3",
  "pydantic-settings>=2.15,<3",
  "python-multipart>=0.0.20,<1",
  "uvicorn[standard]>=0.35,<1",
  "xmltodict>=1.0.4,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=9,<10",
  "pytest-asyncio>=1.1,<2",
  "ruff>=0.12,<1",
]

[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
