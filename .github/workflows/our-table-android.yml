name: Our Table Android preview
on:
  pull_request:
    paths:
      - 'apps/our-table/**'
      - '.github/workflows/our-table-android.yml'
permissions:
  contents: read
jobs:
  android-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify JavaScript and recipe calculations
        run: |
          node --check apps/our-table/web/app.js
          node --check apps/our-table/web/core.js
          node --test apps/our-table/tests/core.test.cjs
      - name: Ensure Android SDK components
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0' >/dev/null
      - name: Build and verify personal-preview APK
        run: bash apps/our-table/scripts/build-android.sh
      - uses: actions/upload-artifact@v4
        with:
          name: our-table-android-preview
          path: apps/our-table/build/out/
          if-no-files-found: error
          retention-days: 14
      - name: Prepare minimal toolchain for local preview compilation
        run: |
          set -euo pipefail
          TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          STAGE="$RUNNER_TEMP/our-table-toolchain"
          mkdir -p "$STAGE/build-tools/35.0.0/lib" "$STAGE/platforms/android-35"
          cp "$TOOLS/aapt2" "$TOOLS/zipalign" "$TOOLS/d8" "$TOOLS/apksigner" "$STAGE/build-tools/35.0.0/"
          cp "$TOOLS/lib/d8.jar" "$TOOLS/lib/apksigner.jar" "$STAGE/build-tools/35.0.0/lib/"
          cp -r "$TOOLS/lib64" "$STAGE/build-tools/35.0.0/"
          cp "$ANDROID_HOME/platforms/android-35/android.jar" "$STAGE/platforms/android-35/"
          tar -C "$STAGE" -czf "$RUNNER_TEMP/our-table-toolchain.tar.gz" .
          sha256sum "$RUNNER_TEMP/our-table-toolchain.tar.gz" > "$RUNNER_TEMP/our-table-toolchain.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: our-table-local-android-toolchain
          path: |
            ${{ runner.temp }}/our-table-toolchain.tar.gz
            ${{ runner.temp }}/our-table-toolchain.sha256
          if-no-files-found: error
          retention-days: 1
