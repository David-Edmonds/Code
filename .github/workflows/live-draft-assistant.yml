name: Live Draft Assistant CI

on:
  pull_request:
    paths:
      - "live-draft-assistant/**"
      - ".github/workflows/live-draft-assistant.yml"
  push:
    branches:
      - main
    paths:
      - "live-draft-assistant/**"
      - ".github/workflows/live-draft-assistant.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: live-draft-assistant

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: live-draft-assistant/pyproject.toml

      - name: Install project
        run: python -m pip install -e ".[dev]"

      - name: Lint
        run: python -m ruff check .

      - name: Test
        run: python -m pytest -q

      - name: Compile
        run: python -m compileall -q app scripts

      - name: Validate Chrome widget
        run: |
          python -m json.tool extension/manifest.json > /dev/null
          node --check extension/service-worker.js
          node --check extension/sidepanel.js

      - name: Package Windows-ready assistant
        run: |
          zip -r ../live-draft-assistant.zip . \
            -x ".venv/*" ".data/*" "__pycache__/*" "*.pyc" ".env"

      - name: Upload Windows-ready assistant
        uses: actions/upload-artifact@v4
        with:
          name: live-draft-assistant
          path: live-draft-assistant.zip
          if-no-files-found: error
